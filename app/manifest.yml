# SecretGate for Jira — Forge manifest (HAND-WRITTEN SCAFFOLD)
# ---------------------------------------------------------------------------
# NOT generated by `forge create`: `forge create` requires an Atlassian login,
# which is the user's own tap (see ../../deployment/DEPLOYMENT_RUNBOOK.md).
# Written from the official Forge docs read 5 Nov 2026:
# - dashboard tutorial (global:fullPage / jira:globalPage, render: native,
#   routePrefix, nodejs24.x, classic scopes)
#   https://developer.atlassian.com/platform/forge/build-a-dashboard-app-with-the-global-full-page-module-connected-to-jira/
# - Jira issue panel reference
#   https://developer.atlassian.com/platform/forge/manifest-reference/modules/jira-issue-panel/
# - Jira global page reference (ONE global page per app)
#   https://developer.atlassian.com/platform/forge/manifest-reference/modules/jira-global-page/
# First `forge deploy` after login is expected to surface small corrections
# (notably: app.id is assigned by `forge register` / `forge create`).
modules:
  jira:issuePanel:
    - key: secretgate-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: SecretGate
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:globalPage:
    - key: secretgate-ledger
      resource: ledger
      resolver:
        function: resolver
      render: native
      title: SecretGate Ledger
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: ledger
    # Custom UI build output (Phase 3). Until then this resource is a
    # placeholder: `forge deploy` will fail on a missing path — either build
    # static/ledger first or temporarily point this at the UI Kit resource.
    # Kept explicit here so the gap is visible, not hidden.
    path: static/ledger/build
app:
  # PLACEHOLDER — replaced by the real id from `forge register` / `forge create`
  # after the user's Atlassian login. Never invent an id.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs24.x
  licensing:
    enabled: false
  compatibility:
    jira:
      required: true
    confluence:
      required: false
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
